# Serverless SQL warehouse for infrastructure setup tasks (DDL, grants, etc.)
# and runtime analytical queries from the Hi Genie Orchestrator.
# Smallest available size on the preview channel.
#
# Referenced by other resources as:
#   ${resources.sql_warehouses.infra_warehouse.id}

resources:
  sql_warehouses:
    infra_warehouse:
      name: Hi Genie Infra [${bundle.target}]

      # Smallest serverless warehouse
      cluster_size: "2X-Small"
      warehouse_type: PRO
      enable_serverless_compute: true
      enable_photon: true

      # Preview channel for latest SQL features (VARIANT, CLUSTER BY AUTO, etc.)
      channel:
        name: CHANNEL_NAME_PREVIEW

      # Auto-stop after 10 minutes of idle to minimize cost
      auto_stop_mins: 10

      # Single cluster — infra tasks are infrequent and sequential
      min_num_clusters: 1
      max_num_clusters: 1

# ---------------------------------------------------------------------------
# Target-specific permissions
#
# hls_fde: handled by top-level target permissions in databricks.yml
#          (CAN_MANAGE → matthew + SPN, CAN_RUN → users)
# dev/prod: set explicitly below since they have no top-level permissions.
# ---------------------------------------------------------------------------
targets:

  dev:
    resources:
      sql_warehouses:
        infra_warehouse:
          permissions:
            - user_name: matthew.giglia@databricks.com
              level: CAN_MANAGE

  prod:
    resources:
      sql_warehouses:
        infra_warehouse:
          permissions:
            - user_name: matthew.giglia@databricks.com
              level: CAN_MANAGE
